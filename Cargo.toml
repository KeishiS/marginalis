[workspace]
members = [
    "crates/marginalis-asciidoc",
    "crates/marginalis-application",
    "crates/marginalis-archive",
    "crates/marginalis-contract",
    "crates/marginalis-domain",
    "crates/marginalis-service",
    "crates/marginalis-sqlite",
    "crates/marginalis-web",
    # CI専用の文書検査ツール。製品コードのcrates/とは区別してtools/で管理する。
    "tools/marginalis-documentation",
]
resolver = "2"

[workspace.package]
version = "0.48.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
adocweave = { git = "https://github.com/KeishiS/adocweave.git", rev = "53f7d4df1cb768cd8912009e80e75b63cafc58b6", package = "adocweave" }
# 共有Authorization Serverの2 crateは同じリポジトリの同じcommitから取得します。
# 版とrevisionはここだけで決め、各crateはworkspace依存として参照します。
mcp-authorization-server = { version = "=0.1.0", git = "https://github.com/KeishiS/mcp-authorization-server.git", rev = "555224bd869576249ee36d082960858ea8d0618b" }
mcp-authorization-server-cimd = { version = "=0.1.0", git = "https://github.com/KeishiS/mcp-authorization-server.git", rev = "555224bd869576249ee36d082960858ea8d0618b" }
# 共有OIDCログインの2 crateも同じリポジトリの同じcommitから取得します(ADR 0015)。
oidc-browser-login = { version = "=0.2.0", git = "https://github.com/KeishiS/oidc-browser-login.git", rev = "bc8161483e29f525ef54fe5cb74bb6928d8659a9", features = ["session", "cookie"] }
oidc-browser-login-testkit = { version = "=0.2.0", git = "https://github.com/KeishiS/oidc-browser-login.git", rev = "bc8161483e29f525ef54fe5cb74bb6928d8659a9", features = ["session"] }
unicode-normalization = "0.1.25"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
base64 = "0.22.1"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8.5"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
async-trait = "0.1.89"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
schemars = "1.2.2"
similar = "2.7.0"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tar = "0.4.46"
liblzma = { version = "0.4.7", default-features = false, features = ["static"] }
thiserror = "2.0.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
