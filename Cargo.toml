[workspace]
members = [
    "crates/marginalis-asciidoc",
    "crates/marginalis-application",
    "crates/marginalis-archive",
    "crates/marginalis-auth-oidc",
    "crates/marginalis-contract",
    "crates/marginalis-domain",
    "crates/marginalis-service",
    "crates/marginalis-sqlite",
    "crates/marginalis-web",
]
resolver = "2"

[workspace.package]
version = "0.26.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
adocweave = { git = "https://github.com/KeishiS/adocweave.git", rev = "c12c63a22ff908bf3d7f9db0203806befc90cb62", package = "adocweave" }
unicode-normalization = "0.1.25"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
base64 = "0.22.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8.5"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["formatting", "macros", "parsing"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
async-trait = "0.1.89"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
schemars = "1.2.2"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tar = "0.4.46"
liblzma = { version = "0.4.7", default-features = false, features = ["static"] }
thiserror = "2.0.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
