<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'nonce-browser-smoke'; style-src-elem 'self' 'nonce-browser-smoke'; style-src-attr 'unsafe-inline'; base-uri 'none'"
    />
    <title>Marginalis browser smoke</title>
    <link rel="stylesheet" href="/assets/editor.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>Marginalis</span>
        </a>
        <nav class="primary-navigation" aria-label="主要な画面">
          <a href="/">ノート</a>
          <a class="button button-primary" href="/notes/new">新規ノート</a>
        </nav>
      </div>
    </header>
    <main
      class="page-main"
      data-application-root
      data-application-config='{"apiBase":"/api/v3","basePath":"","path":"/","search":"","styleNonce":"browser-smoke"}'
    ></main>
    <script nonce="browser-smoke">
      const applicationRoot = document.querySelector("[data-application-root]");
      const applicationConfig = JSON.parse(
        applicationRoot.dataset.applicationConfig,
      );
      applicationConfig.path = window.location.pathname;
      applicationConfig.search = window.location.search;
      applicationRoot.dataset.applicationConfig =
        JSON.stringify(applicationConfig);
    </script>
    <script type="module" src="/assets/editor.js"></script>
  </body>
</html>
