name: Set up Nix
description: >-
  Nixを固定した版で導入し、binary cache(keishis.cachix.org)を読み取りsubstituterとして
  設定する。checkoutはこのactionを参照するために先に実行が必要なため、各jobが自分で行う。
  installerの版更新はこのファイルの1か所で済む。

inputs:
  cachix-auth-token:
    description: >-
      cacheへpushするjobだけが渡すCachixのauth token。未指定(既定)は読み取り専用になる。
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
    - name: Set up the binary cache
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: keishis
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: true
