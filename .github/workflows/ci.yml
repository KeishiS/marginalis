name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          docs_only="$(bash .github/scripts/classify-ci-change.sh "$base" "$GITHUB_SHA")"
          echo "docs-only=$docs_only" >>"$GITHUB_OUTPUT"

  verify-core:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Check documentation
        if: needs.changes.outputs.docs-only == 'true'
        run: |
          nix develop --command cargo make docs-check
          nix develop --command cargo make traceability-check
      - name: Verify
        if: needs.changes.outputs.docs-only != 'true'
        run: nix develop --command cargo make ci-verify

  coverage:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Measure workspace and integration-path coverage
        run: nix develop --command cargo make ci-coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage/workspace-summary.txt
            target/coverage/workspace.json
          if-no-files-found: ignore
          retention-days: 14

  native-aarch64:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Check all Rust targets natively
        run: nix develop --command cargo make native-check
      - name: Build the aarch64 Linux release package
        run: nix develop --command cargo make release-package-aarch64

  verify:
    needs: [changes, verify-core, native-aarch64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the core and native checks
        env:
          CORE_RESULT: ${{ needs.verify-core.result }}
          NATIVE_RESULT: ${{ needs.native-aarch64.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        run: |
          test "$CORE_RESULT" = success
          if [ "$DOCS_ONLY" != true ]; then
            test "$NATIVE_RESULT" = success
          fi

  browser-smoke:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Check the production Web UI in Chromium
        run: nix develop --command cargo make browser-smoke
      - name: Check editor compatibility in Firefox
        run: nix develop --command cargo make browser-editor-firefox
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-smoke
          if-no-files-found: ignore
          retention-days: 7

  nixos-e2e:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        if: needs.changes.outputs.docs-only != 'true'
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      # このjobはCIのcritical pathであり、所要時間の大半をNixのビルドが占める。
      # 入力が変化しない成果物をrun間で再利用するため、Nix storeをcacheへ保存する。
      # 書き込みは`main`へのpush時だけとし、Pull Requestは読み取りだけを行う。
      # 既定branchのcacheはすべてのbranchから読めるため、Pull Requestもこれを利用できる。
      - name: Restore and save the Nix store
        if: needs.changes.outputs.docs-only != 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-nixos-e2e-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-nixos-e2e-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-nixos-e2e-${{ runner.os }}-
          purge-created: 604800
      - name: Run NixOS VM E2E
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          raw_log="$(mktemp)"
          trap 'rm -f "$raw_log"' EXIT
          set +e
          # devShellはこのjobで使用しないため、`nix develop`を経由せず直接実行する。
          # 実行内容は`cargo make ci-nixos-e2e`と同じである。
          nix --extra-experimental-features 'nix-command flakes' flake check -L 2>&1 | tee "$raw_log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/protocol-artifact.sh sanitize "$raw_log" nixos-e2e.log
            nix develop --command bash .github/scripts/protocol-artifact.sh check nixos-e2e.log
          fi
          exit "$status"
      - name: Upload NixOS E2E failure log
        if: failure() && needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: nixos-e2e.log
          if-no-files-found: error
          retention-days: 7
      - name: Skip NixOS VM E2E for documentation-only changes
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Documentation-only changes do not affect the NixOS runtime"
