name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 条件分岐はjobレベルの`if:`だけで行い、step単位の分岐を置かない。必須チェックの
# `verify`と`nixos-e2e`はゲートjobとして常に実行し、文書だけの変更では実作業jobを
# 丸ごと省略したうえでゲートが成功を報告する。
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          docs_only="$(bash .github/scripts/classify-ci-change.sh "$base" "$GITHUB_SHA")"
          echo "docs-only=$docs_only" >>"$GITHUB_OUTPUT"

  verify-core:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Verify
        run: nix develop --command cargo make verify

  verify-docs:
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Check documentation
        run: nix develop --command cargo make docs-check

  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # coverageは必須gate(verify)に含まれないため、mainへのpushだけで測定して推移を追う。
  coverage:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Measure workspace and integration-path coverage
        run: nix develop --command cargo make coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/coverage/workspace-summary.txt
            target/coverage/workspace.json
          if-no-files-found: ignore
          retention-days: 14

  native-aarch64:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Check all Rust targets natively
        run: nix develop --command cargo make native-check
      - name: Build the aarch64 Linux release package
        run: nix develop --command cargo make release-package-aarch64

  # mainへのpush時にdevShell closureをbinary cacheへpushする。以降のrunでは各jobの
  # nix developがAdocWeaveのsource buildとtoolchain展開のかわりに取得だけで済む。
  # PRではsecretを使わない。必須checkには含めない。
  devshell-cache-x86_64:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and push the devShell closure
        run: |
          nix develop --profile /tmp/devshell-profile --command true
          cachix push keishis /tmp/devshell-profile

  devshell-cache-aarch64:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and push the devShell closure
        run: |
          nix develop --profile /tmp/devshell-profile --command true
          cachix push keishis /tmp/devshell-profile

  verify:
    needs: [changes, verify-core, verify-docs, dependency-review, native-aarch64, browser-smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the checks that match the change classification
        env:
          CORE_RESULT: ${{ needs.verify-core.result }}
          DOCS_RESULT: ${{ needs.verify-docs.result }}
          NATIVE_RESULT: ${{ needs.native-aarch64.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash .github/scripts/check-ci-gate.sh \
            "$EVENT_NAME" "$DOCS_ONLY" "$CORE_RESULT" "$DOCS_RESULT" \
            "$NATIVE_RESULT" "$BROWSER_RESULT" "$DEPENDENCY_RESULT"

  browser-smoke:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Check the production Web UI in Chromium
        run: nix develop --command cargo make browser-smoke
      - name: Check editor compatibility in Firefox
        run: nix develop --command cargo make browser-editor-firefox
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-smoke
          if-no-files-found: ignore
          retention-days: 7

  nixos-e2e-vm:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
      # このjobはCIのcritical pathであり、所要時間の大半をNixのビルドが占める。
      # 入力が変化しない成果物をrun間で再利用するため、Nix storeをcacheへ保存する。
      # 書き込みは`main`へのpush時だけとし、Pull Requestは読み取りだけを行う。
      # 既定branchのcacheはすべてのbranchから読めるため、Pull Requestもこれを利用できる。
      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-nixos-e2e-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-nixos-e2e-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-nixos-e2e-${{ runner.os }}-
          purge-created: 604800
      - name: Run NixOS VM E2E
        run: |
          raw_log="$(mktemp)"
          trap 'rm -f "$raw_log"' EXIT
          set +e
          # devShellはこのjobで使用しないため、`nix develop`を経由せず直接実行する。
          # 実行内容は`cargo make nix-release-check`と同じである。
          nix --extra-experimental-features 'nix-command flakes' flake check -L 2>&1 | tee "$raw_log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/protocol-artifact.sh sanitize "$raw_log" nixos-e2e.log
            nix develop --command bash .github/scripts/protocol-artifact.sh check nixos-e2e.log
          fi
          exit "$status"
      - name: Upload NixOS E2E failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: nixos-e2e.log
          if-no-files-found: error
          retention-days: 7

  nixos-e2e:
    needs: [changes, nixos-e2e-vm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the NixOS VM E2E unless the change is documentation-only
        env:
          VM_RESULT: ${{ needs.nixos-e2e-vm.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "Documentation-only changes do not affect the NixOS runtime"
          else
            test "$VM_RESULT" = success
          fi

  # 検証を通ったmainのcommitからrelease candidateを作る。候補は公開するassetとRelease Notes、
  # source commitとdigestを固定した集合で、stable release workflowが作り直さずにそのまま
  # 公開する。ここで作られていないcommitは公開できない。
  #
  # 公開済みの版かどうかで作成を分けない。候補の作成自体は軽く、公開してよいかは
  # stable release workflowのreadinessがtagとReleaseの不在で判定する。
  #
  # 条件に`always()`が必要である。ゲートjobの`verify`は`verify-core`と`verify-docs`を
  # 集約し、変更分類に応じて必ずどちらかが省略される。`always()`がないと、この省略が
  # `verify`を越えて伝わり、`verify`が成功していてもこのjobが省略される。省略を越えて
  # 実行したうえで、必要なゲートの成功をこのjob自身が確かめる。
  release-candidate:
    needs: [changes, verify, nixos-e2e]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.verify.result == 'success' &&
      needs.nixos-e2e.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the release candidate
        run: |
          set -euo pipefail
          version="$(jq -er .packageVersion release-manifest.json)"
          echo "release candidate: v$version $GITHUB_SHA"
          bash .github/scripts/release-candidate.sh generate candidate "$GITHUB_SHA"
          bash .github/scripts/release-candidate.sh verify candidate "$GITHUB_SHA"
      - name: Upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
