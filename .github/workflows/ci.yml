name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          docs_only=false
          if [[ -n "$base" && "$base" != "$zero" ]] && git cat-file -e "$base^{commit}"; then
            docs_only=true
            changed=false
            while IFS= read -r path; do
              changed=true
              case "$path" in
                docs/openapi.json)
                  docs_only=false
                  break
                  ;;
                docs/* | issues/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done < <(git diff --name-only "$base" "$GITHUB_SHA")
            if [[ "$changed" == false ]]; then
              docs_only=false
            fi
          fi
          echo "docs-only=$docs_only" >>"$GITHUB_OUTPUT"

  verify:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check documentation
        if: needs.changes.outputs.docs-only == 'true'
        run: bash .github/scripts/check-docs.sh
      - name: Install Nix
        if: needs.changes.outputs.docs-only != 'true'
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Verify
        if: needs.changes.outputs.docs-only != 'true'
        run: nix develop --command cargo make verify

  coverage:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Measure workspace and integration-path coverage
        run: nix develop --command cargo make coverage

  nixos-e2e:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        if: needs.changes.outputs.docs-only != 'true'
        uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3.21.0
      - name: Run NixOS VM E2E
        if: needs.changes.outputs.docs-only != 'true'
        run: nix develop --command cargo make nix-release-check
      - name: Skip NixOS VM E2E for documentation-only changes
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "docs/** and issues/** changes do not affect the NixOS runtime"
