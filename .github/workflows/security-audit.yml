name: Dependency security audit

on:
  schedule:
    - cron: "21 3 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-security-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup
      - name: Audit locked Rust and frontend dependencies
        run: nix develop --command cargo make security-audit
