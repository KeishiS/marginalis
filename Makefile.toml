[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "pre-push"

[tasks.fmt]
description = "Format Rust, Nix, and frontend source files"
dependencies = ["fmt-rust", "fmt-nix", "frontend-format"]

[tasks.format]
alias = "fmt"

[tasks.fmt-rust]
description = "Format Rust source files"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-nix]
description = "Format the Nix flake"
command = "nixfmt"
args = ["flake.nix", "nix/module.nix"]

[tasks.fmt-check]
description = "Check Rust, Nix, and frontend formatting without modifying files"
dependencies = ["fmt-check-rust", "fmt-check-nix", "frontend-format-check"]

[tasks.format-check]
alias = "fmt-check"

[tasks.fmt-check-rust]
description = "Check Rust formatting without modifying files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-check-nix]
description = "Check Nix formatting without modifying files"
command = "nixfmt"
args = ["--check", "flake.nix", "nix/module.nix"]

[tasks.check]
description = "Type-check all workspace targets and features"
dependencies = ["frontend-build"]
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features"]

[tasks.clippy]
description = "Run Clippy with warnings denied"
dependencies = ["frontend-build"]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.lint]
alias = "clippy"

[tasks.test]
description = "Run all workspace tests"
dependencies = ["frontend-build"]
command = "cargo"
args = ["test", "--workspace", "--all-features"]

[tasks.build]
description = "Build all workspace targets and features"
dependencies = ["frontend-build"]
command = "cargo"
args = ["build", "--workspace", "--all-targets", "--all-features"]

[tasks.flake-check]
description = "Evaluate every declared Nix flake system without building outputs"
command = "nix"
args = ["--extra-experimental-features", "nix-command flakes", "flake", "check", "--all-systems", "--no-build"]

[tasks.actionlint]
description = "Validate GitHub Actions workflow syntax"
command = "actionlint"
args = [
  ".github/workflows/ci.yml",
  ".github/workflows/release-gate.yml",
  ".github/workflows/security-audit.yml",
]

[tasks.ci-path-classifier]
description = "Validate the documentation-only CI path classification"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-classify-docs-only.sh
bash .github/scripts/test-classify-ci-change.sh
'''

[tasks.protocol-regression-assets]
description = "Validate secret-safe protocol failure artifacts"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-protocol-artifact.sh
'''

[tasks.docs-check]
description = "Validate the repository documentation corpus and its references"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-markdown-links.sh
bash .github/scripts/test-asciidoc.sh
bash .github/scripts/test-documentation-corpus.sh
bash .github/scripts/check-docs.sh
'''

[tasks.traceability-check]
description = "Validate requirement coverage and versioned acceptance evidence"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-traceability.sh
bash .github/scripts/check-traceability.sh
bash .github/scripts/test-design-traceability.sh
bash .github/scripts/check-design-traceability.sh
'''

[tasks.security-audit]
description = "Check Cargo.lock against the current RustSec advisory database"
dependencies = ["frontend-security-audit"]
command = "cargo"
args = ["audit", "--deny", "warnings", "--ignore", "RUSTSEC-2023-0071"]

[tasks.nix-release-check]
description = "Build and run every Nix flake check, including all NixOS VM E2E tests"
command = "nix"
args = ["--extra-experimental-features", "nix-command flakes", "flake", "check", "-L"]

[tasks.release-package]
description = "Build the Linux release package without creating a result symlink"
command = "nix"
args = ["--extra-experimental-features", "nix-command flakes", "build", ".#packages.x86_64-linux.default", "--no-link"]

[tasks.release-package-aarch64]
description = "Build the aarch64 Linux release package without creating a result symlink"
command = "nix"
args = ["--extra-experimental-features", "nix-command flakes", "build", ".#packages.aarch64-linux.default", "--no-link"]

[tasks.native-release-package]
description = "Build the release package when running natively on aarch64 Linux"
script_runner = "@shell"
script = '''
set -eu
if [ "$(uname -s)" = Linux ] && [ "$(uname -m)" = aarch64 ]; then
  cargo make release-package-aarch64
else
  echo "aarch64 release package build is only run on native aarch64 Linux"
fi
'''

[tasks.release-metadata]
description = "Verify release version, tag, changelog, and declared dual-license files"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-release-document-state.sh
expected_version="$(
  cargo metadata --locked --no-deps --format-version 1 |
    jq -er '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end'
)"
test -s LICENSE-MIT
test -s LICENSE-APACHE
cargo metadata --locked --no-deps --format-version 1 | jq -e \
  --arg version "$expected_version" '
  all(.packages[];
    .version == $version
    and .license == "MIT OR Apache-2.0"
    and .publish == [])
'
test "$(
  nix eval --raw .#packages.x86_64-linux.default.version
)" = "$expected_version"
test "$(
  nix eval --raw .#packages.x86_64-linux.frontend.version
)" = "$expected_version"
acceptance_file="docs/acceptance-results/v$expected_version.adoc"
test -s "$acceptance_file"
grep -Fq "xref:acceptance-results/v$expected_version.adoc#top" docs/acceptance.adoc
grep -Fq -- "* タグ: \`\`v$expected_version\`\`" "$acceptance_file"
bash .github/scripts/check-release-document-state.sh \
  "$expected_version" "$acceptance_file" CHANGELOG.adoc
'''

[tasks.release-gate]
description = "Run every automated gate required before an RC or final release"
dependencies = ["verify", "coverage", "release-metadata", "nix-release-check", "release-package"]

[tasks.unused-dependencies]
description = "Reject dependencies that are declared but never used"
command = "cargo-machete"
args = ["--with-metadata"]

[tasks.dependency-boundaries]
description = "Verify every workspace production dependency against the architecture boundary"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-dependency-boundaries.sh
bash .github/scripts/check-dependency-boundaries.sh
'''

[tasks.shared-authorization-server]
description = "Verify the pinned revision, version, and reachability of the shared Authorization Server crates"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-shared-authorization-server.sh
bash .github/scripts/check-shared-authorization-server.sh
'''

[tasks.observability-check]
description = "Require stable event fields and reject sensitive fields in production logs"
script_runner = "@shell"
script = '''
set -eu
bash .github/scripts/test-observability.sh
bash .github/scripts/check-observability.sh
'''

[tasks.production-reachability]
description = "Reject retired v0.2 components and routes from the production graph"
script_runner = "@shell"
script = '''
set -eu
actual=$(
  cargo metadata --locked --format-version 1 |
    jq -r '
      . as $metadata
      | ($metadata.packages[]
          | select(.name == "marginalis-service")
          | .id) as $root
      | ($metadata.resolve.nodes
          | map({key: .id, value: [.deps[].pkg]})
          | from_entries) as $graph
      | def closure($pending; $seen):
          if ($pending | length) == 0 then $seen
          else
            [$pending[]
              | select(. as $id | ($seen | index($id) | not))] as $new
            | closure([$new[] as $id | $graph[$id][]?]; $seen + $new)
          end;
        closure([$root]; [])[] as $id
      | select($metadata.workspace_members | index($id))
      | $metadata.packages[]
      | select(.id == $id)
      | .name
    ' |
    sort -u
)
expected='marginalis-application
marginalis-archive
marginalis-asciidoc
marginalis-auth-oidc
marginalis-contract
marginalis-domain
marginalis-service
marginalis-sqlite
marginalis-web'
test "$actual" = "$expected" || {
  echo "unexpected workspace crate in marginalis-service production dependencies" >&2
  diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
  exit 1
}

if rg -n \
  '/api/v1|marginalis[_-](files|membership)|membershipTokenFile|root_password|MARGINALIS_ROOT' \
  Cargo.toml crates --glob 'Cargo.toml' --glob '*.rs'
then
  echo "retired v0.2 production symbol or route remains" >&2
  exit 1
fi

# 公開済みの記録は当時の名前のまま残す。CHANGELOG、ADR、評価記録は検査の対象外とする。
if rg -n \
  'MARGINALIS_MCP_(AUTHORIZATION_ISSUER|UPSTREAM_ISSUER_CLAIM|UPSTREAM_SUBJECT_CLAIM|GROUPS_CLAIM|EXTERNAL_ISSUER)|externalAuthorization|marginalis-auth-oauth' \
  . \
  --glob '!docs/frozen/**' \
  --glob '!docs/adr/**' \
  --glob '!docs/mcp-authorization-server-evaluation.adoc' \
  --glob '!CHANGELOG.adoc' \
  --glob '!Makefile.toml' \
  --glob '!target/**' \
  --glob '!test-results/**' \
  --glob '!.git/**'
then
  echo "retired external Authorization Server dependency or configuration remains" >&2
  exit 1
fi
'''

[tasks.coverage]
description = "Generate the workspace coverage report"
dependencies = ["frontend-build"]
script_runner = "@shell"
script = '''
set -eu
report_dir=target/coverage
ignored_sources='(^|/)tests?(/|\.rs$)'
mkdir -p "$report_dir"

cargo llvm-cov clean --workspace
cargo llvm-cov \
  --workspace --all-features --locked \
  --ignore-filename-regex "$ignored_sources" \
  --json --output-path "$report_dir/workspace.json"
jq -r '
  def row($name; $summary):
    [$name,
     $summary.lines.count, $summary.lines.covered, $summary.lines.percent,
     $summary.regions.count, $summary.regions.covered, $summary.regions.percent,
     $summary.functions.count, $summary.functions.covered, $summary.functions.percent]
    | @tsv;
  . as $report
  | (["file", "lines", "covered", "line_%", "regions", "covered", "region_%",
      "functions", "covered", "function_%"] | @tsv),
    ($report.data[0].files[] | row(.filename; .summary)),
    row("TOTAL"; $report.data[0].totals)
' "$report_dir/workspace.json" >"$report_dir/workspace-summary.txt"

printf '\nworkspace coverage\n'
cat "$report_dir/workspace-summary.txt"
printf '\ncoverage reports: %s\n' "$report_dir"
'''

[tasks.contract-check]
description = "Verify generated REST, MCP, and TypeScript contracts"
dependencies = ["openapi-validate"]
command = "cargo"
args = ["run", "-p", "marginalis-contract", "--bin", "generate", "--", "--check"]

[tasks.openapi-validate]
description = "Validate the generated OpenAPI structure and local references"
script_runner = "@shell"
script = '''
set -eu
jq -e '
  def local_ref_resolves($root):
    if startswith("#/")
    then split("/")[1:] as $path | ($root | getpath($path)) != null
    else true
    end;
  . as $root
  | .openapi == "3.1.0"
    and (.info.title | type == "string")
    and (.info.version | type == "string")
    and (.paths | type == "object" and length > 0)
    and ([.. | objects | select(has("$ref")) | ."$ref" | local_ref_resolves($root)] | all)
' docs/openapi.json >/dev/null
'''

[tasks.adocweave-version-check]
description = "Verify the pinned AdocWeave package version and supply-chain identity"
script_runner = "@shell"
script = '''
set -eu
expected_version="0.33.0"
expected_revision="88c98d22f0e43b23348e5281d65d4d02f3bba97a"
expected_hash="sha256-pK192ra6uJpYIlP+f2pNGafeVEzVhoxxioIUOQnglaQ="

cargo metadata --locked --format-version 1 | jq -e \
  --arg version "$expected_version" \
  --arg revision "$expected_revision" '
    [.packages[]
      | select(.name == "adocweave")
      | select(
          .version == $version
          and (.source | contains("rev=" + $revision))
          and (.source | endswith("#" + $revision))
        )]
    | length == 1
  ' >/dev/null

grep -Fq "pub const ADOCWEAVE_SOURCE_REVISION: &str = \"$expected_revision\";" \
  crates/marginalis-asciidoc/src/lib.rs
grep -Fq "pub const PINNED_ADOCWEAVE_PACKAGE_VERSION: &str = \"$expected_version\";" \
  crates/marginalis-asciidoc/src/lib.rs
grep -Fq "\"adocweave-$expected_version\" = \"$expected_hash\";" flake.nix

adocweave_manifest="$(
  cargo metadata --locked --format-version 1 \
    | jq -r --arg version "$expected_version" \
      '.packages[] | select(.name == "adocweave" and .version == $version) | .manifest_path'
)"
test -f "$(dirname "$adocweave_manifest")/conformance/cases.json"

if grep -Eq 'WASM_API_VERSION|PINNED_CONTRACTS|CONTRACT_VERSION|contractVersion' \
  crates/marginalis-asciidoc/src/lib.rs; then
  echo "legacy AdocWeave version identity remains" >&2
  exit 1
fi
'''

[tasks.verify]
description = "Run formatting, static analysis, unit and integration tests, and flake evaluation"
dependencies = ["frontend-verify", "fmt-check", "check", "clippy", "test", "security-audit", "dependency-boundaries", "shared-authorization-server", "unused-dependencies", "observability-check", "production-reachability", "contract-check", "adocweave-version-check", "docs-check", "traceability-check", "actionlint", "ci-path-classifier", "protocol-regression-assets", "flake-check", "release-metadata"]

[tasks.ci-verify]
description = "Run the GitHub Actions verify suite"
alias = "verify"

[tasks.native-check]
description = "Compile every Rust target and feature on the current native architecture"
dependencies = ["frontend-build"]
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features", "--locked"]

[tasks.browser-smoke]
description = "Run the lightweight Chromium browser tests without Kanidm or a NixOS VM"
dependencies = ["frontend-build"]
command = "playwright"
args = ["test", "--config", "tests/browser/playwright.smoke.config.js"]

[tasks.browser-editor-firefox]
description = "Check editor selection and typography compatibility in Firefox"
dependencies = ["frontend-build"]
env = { "MARGINALIS_BROWSER" = "firefox", "MARGINALIS_COMPAT_ONLY" = "true" }
command = "playwright"
args = ["test", "--config", "tests/browser/playwright.smoke.config.js"]

[tasks.ci-early]
description = "Run architecture-native compilation, package build, and browser tests"
dependencies = ["native-check", "native-release-package", "browser-smoke", "browser-editor-firefox"]

[tasks.ci-coverage]
description = "Run the GitHub Actions coverage suite"
alias = "coverage"

[tasks.ci-nixos-e2e]
description = "Run the GitHub Actions NixOS E2E suite"
alias = "nix-release-check"

[tasks.ci]
description = "Run every GitHub Actions validation suite"
dependencies = ["ci-verify", "ci-early", "ci-coverage", "ci-nixos-e2e"]

[tasks.pre-push]
description = "Run every GitHub Actions validation required before pushing code"
alias = "ci"

[tasks.frontend-install]
description = "Install the locked frontend dependencies"
cwd = "frontend"
command = "pnpm"
args = ["install", "--frozen-lockfile"]

[tasks.frontend-format]
description = "Format frontend source files"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "format"]

[tasks.frontend-format-check]
description = "Check frontend formatting without modifying files"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "format:check"]

[tasks.frontend-lint]
description = "Run frontend static analysis"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "lint"]

[tasks.frontend-lint-css]
description = "Reject colours, spacing and font sizes written outside the design tokens"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "lint:css"]

[tasks.frontend-typecheck]
description = "Type-check frontend source and tests"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "typecheck"]

[tasks.frontend-test]
description = "Run frontend unit tests"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["test"]

[tasks.frontend-security-audit]
description = "Check locked frontend dependencies for known vulnerabilities"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["audit", "--audit-level=high"]

[tasks.frontend-build]
description = "Build browser assets for embedding in the Rust server"
dependencies = ["frontend-install"]
cwd = "frontend"
command = "pnpm"
args = ["run", "build"]

[tasks.frontend-bundle-size]
description = "Keep production Web UI code and self-hosted fonts within reviewed size budgets"
dependencies = ["frontend-build"]
script = '''
entry_bytes="$(wc -c < frontend/dist/assets/editor.js)"
maximum_entry_bytes=300000
if [ "$entry_bytes" -gt "$maximum_entry_bytes" ]; then
  echo "the initial Web UI entry is ${entry_bytes} bytes; the limit is ${maximum_entry_bytes} bytes." >&2
  exit 1
fi
# 経路別に読み込む画面は、独立したchunkの存在と大きさを両方検査する。検索結果が0件のまま
# 上限検査を通ると、初期entryへ誤って戻した変更を見逃すためである。
check_screen_chunk() {
  screen_label="$1"
  chunk_pattern="$2"
  maximum_screen_bytes="$3"
  screen_bytes="$(find frontend/dist/assets -name "$chunk_pattern" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
  if [ "$screen_bytes" -eq 0 ]; then
    echo "the ${screen_label} chunk is missing." >&2
    exit 1
  fi
  if [ "$screen_bytes" -gt "$maximum_screen_bytes" ]; then
    echo "the ${screen_label} screen is ${screen_bytes} bytes; the limit is ${maximum_screen_bytes} bytes." >&2
    exit 1
  fi
  echo "${screen_label} screen: ${screen_bytes}/${maximum_screen_bytes} bytes"
}

# CodeMirrorやD3などの大きな依存を持つ画面と、利用頻度が限られる設定・削除済み一覧を
# 初期entryから分離した状態で保つ。
check_screen_chunk "editor" 'EditorApplication-*.js' 450000
check_screen_chunk "graph" 'GraphPage-*.js' 120000
check_screen_chunk "deleted notes" 'DeletedNotesPage-*.js' 30000
check_screen_chunk "math macro settings" 'MathMacroSettingsPage-*.js' 30000
check_screen_chunk "MCP access settings" 'McpAccessSettingsPage-*.js' 30000
font_bytes="$(find frontend/dist/assets -name '*.woff2' -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
maximum_font_bytes=13000000
if [ "$font_bytes" -gt "$maximum_font_bytes" ]; then
  echo "self-hosted Web fonts are ${font_bytes} bytes; the limit is ${maximum_font_bytes} bytes." >&2
  exit 1
fi
echo "initial Web UI entry: ${entry_bytes}/${maximum_entry_bytes} bytes"
echo "self-hosted Web fonts: ${font_bytes}/${maximum_font_bytes} bytes"
'''

[tasks.frontend-verify]
description = "Run frontend formatting, analysis, tests, audit, and build"
dependencies = ["frontend-format-check", "frontend-lint", "frontend-lint-css", "frontend-typecheck", "frontend-test", "frontend-security-audit", "frontend-build", "frontend-bundle-size"]
